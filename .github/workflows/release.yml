name: Release

# 推送 v* 标签时触发：在 Windows / macOS runner 上打安装包并发布到 GitHub Releases
on:
  push:
    tags:
      - 'v*'

# electron-builder 需要写权限来创建 Release 并上传安装包
permissions:
  contents: write

jobs:
  # 先把 Release 建好（published，非 draft）。
  # electron-builder 并发上传时，每个上传线程若发现 Release 不存在会各自去创建同一 tag，
  # 撞 422 already_exists 导致发布失败、资产残缺。预建 Release 让 electron-builder 只上传、不创建，
  # 从源头消除这个竞态；也因此两个平台 job 可以安全并行。
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          gh release view "$TAG" --repo "$REPO" \
            || gh release create "$TAG" --repo "$REPO" --verify-tag \
                 --title "$TAG" --notes "Polaris $TAG · 自动发布（桌面自动更新源）"

  release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Node 版本只认 .nvmrc（packages/ 下的 A 与 BCD 要求 >=22.22.1，pnpm 11 要求 >=22.13）
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 先构建渲染层（dist/），electron-builder 再据此打包
      - run: pnpm build

      - name: Build & publish (${{ matrix.platform }})
        run: pnpm exec electron-builder --${{ matrix.platform }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # MVP 阶段不做代码签名 / 公证，避免 CI 去查找签名身份
          CSC_IDENTITY_AUTO_DISCOVERY: false
